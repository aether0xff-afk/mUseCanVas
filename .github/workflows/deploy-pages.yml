name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/audio.js
          node --check src/input.js
          node --check src/music.js
          node --check src/strokes.js
          node --check src/viewport.js
          node --check sw.js
      - name: Stage static site
        run: |
          mkdir -p _site/src
          cp index.html styles.css manifest.webmanifest icon.svg sw.js _site/
          cp src/*.js _site/src/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
